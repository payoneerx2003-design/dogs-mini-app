<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGS Ecosystem - Claim Portal</title>
    
    <!-- Monetag Main Tag -->
    <script src='//libtl.com/sdk.js' data-zone='12246297' data-sdk='show_12246297'></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .logo-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .balance-card {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .balance-title {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .balance-value {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
        }
        .tasks-section {
            text-align: left;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
        .task-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .task-info h4 {
            font-size: 14px;
            color: #f1f5f9;
            margin-bottom: 2px;
        }
        .task-info p {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
        }
        .claim-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246,.3);
        }
        .claim-btn:active {
            transform: scale(0.95);
        }
        .footer-note {
            font-size: 11px;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-box">🐕</div>
        <h1>DOGS Community</h1>
        <p class="subtitle">Complete micro-tasks to earn rewards</p>

        <div class="balance-card">
            <div class="balance-title">Total Balance</div>
            <div class="balance-value" id="balance">0.00 DOGS</div>
        </div>

        <div class="tasks-section">
            <div class="section-title">Available Tasks</div>
            <div class="task-card">
                <div class="task-info">
                    <h4>Watch Sponsor Ad</h4>
                    <p>+50.00 DOGS</p>
                </div>
                <button class="claim-btn" onclick="triggerAd()">Start</button>
            </div>
        </div>

        <div class="footer-note">Secure WebApp Powered by Telegram</div>
    </div>

    <script>
        let currentBalance = 0.0;

        function triggerAd() {
            if(typeof show_12246297 === 'function') {
                show_12246297().then(() => {
                    // Reward user after watching ad successfully
                    currentBalance += 50.00;
                    document.getElementById('balance').innerText = currentBalance.toFixed(2) + " DOGS";
                    alert("Task Completed! +50.00 DOGS added to your balance.");
                }).catch((e) => {
                    console.log(e);
                    alert("Ad could not be loaded fully. Please try again.");
                });
            } else {
                alert("Ad script is loading, please wait a second and retry.");
            }
        }
    </script>
</body>
</html>
