    <style>
        * {

        body {
            background-color: #fcf8f5;

        .top-bar {

        .user-welcome {
            display: flex;

        .user-avatar {

            height: 42px;
            background: #3b82f6;
            color: white;
            border-radius: 50%;

            justify-content: center;

        }
        .user-info span {
            font-size: 12px;
            color: #9ca3af;
            display: block;
        }
        .user-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }
        .hero-card {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 50%, #9333ea 100%);
            border-radius: 24px;
            padding: 24px;
            color: white;
            margin-bottom: 22px;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
            position: relative;
            overflow: hidden;
        }
        .hero-top {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 10px;
        }
        .balance-num {
            font-size: 34px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .balance-sub {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 20px;
        }
        .hero-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-earn {
            flex: 1;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #111827;
            border: none;
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
        }
        .btn-withdraw {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 12px;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .task-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #f3f4f6;
        }
        .task-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .task-logo {
            width: 44px;
            height: 44px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .task-details h4 {
            font-size: 15px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 2px;
        }
        .task-details p {
            font-size: 12px;
            color: #6b7280;
        }
        .watch-btn {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: #111827;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
        }
        .nav-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }
        .nav-btn.active {
            color: #f59e0b;
            font-weight: 600;
        }
        .nav-icon {
            font-size: 20px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            display: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">Reward Credited!</div>

    <!-- Top Header -->
    <div class="top-bar">
        <div class="brand-box">
            <div class="brand-icon">🐕</div>
            <span>Free DOGS</span>
        </div>
        <div class="top-right-btns">
            <button class="pill-btn">🌐 EN</button>
            <button class="pill-btn">🎧 Support</button>
        </div>
    </div>

    <!-- User Greeting -->
    <div class="user-welcome">
        <div class="user-avatar" id="userAvatar">U</div>
        <div class="user-info">
            <span>Welcome back</span>
            <h3 id="userName">Umar Ahmed</h3>
        </div>
    </div>

    <!-- Hero Balance Card -->
    <div class="hero-card">
        <div class="hero-top">
            <span>🐕</span>
            <span>Your balance</span>
        </div>
        <div class="balance-num"><span id="balanceAmount">5</span> DOGS</div>
        <div class="balance-sub" id="totalEarned">5 DOGS earned in total</div>
        <div class="hero-buttons">
            <button class="btn-earn" onclick="triggerAd(50)">Earn more</button>
            <button class="btn-withdraw" onclick="alert('Minimum withdrawal is 5,000 DOGS!')">Withdraw</button>
        </div>
    </div>

    <!-- Tasks Section -->
    <div class="section-title">Available Tasks</div>
    <div class="task-list">
        
        <div class="task-card">
            <div class="task-left">
                <div class="task-logo" style="background:#eff6ff; color:#2563eb;">A</div>
                <div class="task-details">
                    <h4>Adsgram</h4>
                    <p>+20 DOGS &bull; 200/200 left today</p>
                </div>
            </div>
            <button class="watch-btn" onclick="triggerAd(20)">Watch</button>
        </div>

        <div class="task-card">
            <div class="task-left">
                <div class="task-logo" style="background:#ecfdf5; color:#059669;">ê</div>
                <div class="task-details">
                    <h4>Monetag</h4>
                    <p>+20 DOGS &bull; 2000/2000 left today</p>
                </div>
            </div>
            <button class="watch-btn" onclick="triggerAd(20)">Watch</button>
        </div>

        <div class="task-card">
            <div class="task-left">
                <div class="task-logo" style="background:#fef2f2; color:#dc2626;">R</div>
                <div class="task-details">
                    <h4>RichAds</h4>
                    <p>+30 DOGS &bull; 500/500 left today</p>
                </div>
            </div>
            <button class="watch-btn" onclick="triggerAd(30)">Watch</button>
        </div>

        <div class="task-card">
            <div class="task-left">
                <div class="task-logo" style="background:#fef3c7; color:#d97706;">⚡</div>
                <div class="task-details">
                    <h4>Daily Bonus Pack</h4>
                    <p>+100 DOGS &bull; 1/1 left today</p>
                </div>
            </div>
            <button class="watch-btn" onclick="triggerAd(100)">Watch</button>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-btn active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="alert('Tasks section is active above!')">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" onclick="alert('Invite friends to earn 10% commission!')">
            <span class="nav-icon">👥</span>
            <span>Invite</span>
        </button>
        <button class="nav-btn" onclick="alert('Games coming soon!')">
            <span class="nav-icon">🎮</span>
            <span>Games</span>
        </button>
        <button class="nav-btn" onclick="alert('Minimum 5,000 DOGS required to withdraw.')">
            <span class="nav-icon">👛</span>
            <span>Wallet</span>
        </button>
    </div>

    <script>
        // Telegram WebApp Setup
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || "DOGS User";
            document.getElementById('userName').innerText = fullName;
            document.getElementById('userAvatar').innerText = (user.first_name || "D")[0].toUpperCase();
        }

        // LocalStorage Data
        let balance = parseInt(localStorage.getItem('dogs_bal')) || 5;
        let totalEarned = parseInt(localStorage.getItem('dogs_earned')) || 5;

        function updateDisplay() {
            document.getElementById('balanceAmount').innerText = balance;
            document.getElementById('totalEarned').innerText = totalEarned + " DOGS earned in total";
        }
        updateDisplay();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        // Trigger Monetag Ad & Reward User
        function triggerAd(rewardAmount) {
            if (typeof show_12246297 === 'function') {
                show_12246297().then(() => {
                    balance += rewardAmount;
                    totalEarned += rewardAmount;
                    localStorage.setItem('dogs_bal', balance);
                    localStorage.setItem('dogs_earned', totalEarned);
                    updateDisplay();
                    showToast(`Successfully earned +${rewardAmount} DOGS!`);
                }).catch((e) => {
                    showToast("Ad could not load, please try again.");
                });
            } else {
                showToast("Ad script is loading, please wait...");
            }
        }
    </script>
</body>
</html>
